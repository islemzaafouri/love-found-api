# Copy this file to application.properties for local development.
# Keep application.properties out of Git. Never commit real credentials.

spring.application.name=love-found-api

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lovefound}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway database migrations
spring.flyway.enabled=true

# JWT — provide a private random secret of at least 32 bytes for HS256.
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (default: 24 hours).
jwt.expiration=${JWT_EXPIRATION:86400000}

# Local Angular development origin
# CORS is currently configured in CorsConfig.java and controller annotations.
